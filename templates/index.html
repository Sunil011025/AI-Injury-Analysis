<!DOCTYPE html>
<html>

<head>
    <title>AI Injury Analysis</title>
</head>

<body>

    <h1>AI-Powered Injury Analysis</h1>

    <p>
        Upload an image of a visible injury to receive
        AI-assisted first-aid information.
    </p>


    <form
        action="/analyze"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="image"
            id="imageInput"
            accept=".jpg,.jpeg,.png,.webp"
            required
        >

        <br><br>

        <img
            id="preview"
            width="300"
            style="display:none;"
        >

        <br><br>

        <button type="submit">
            Analyze Injury
        </button>

    </form>


    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function() {

            const file = imageInput.files[0];

            if (file) {

                preview.src = URL.createObjectURL(file);

                preview.style.display = "block";

            }

        });

    </script>

</body>

</html>
